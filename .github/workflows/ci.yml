name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://devpulse:devpulse_secret@localhost:5433/devpulse?schema=public
      TEST_DATABASE_URL: postgresql://devpulse:devpulse_secret@localhost:5433/devpulse_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: devpulse_ci_test_jwt_secret_value
      JWT_ACCESS_SECRET: devpulse_ci_test_jwt_access_secret_value
      JWT_REFRESH_SECRET: devpulse_ci_test_jwt_refresh_secret_value
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      WEBHOOK_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Docker services (PostgreSQL 16 & Redis 7)
        run: |
          docker compose up -d
          until docker compose exec -T postgres pg_isready -U devpulse -d devpulse; do
            echo "Waiting for postgres to be ready..."
            sleep 2
          done
          docker compose exec -T postgres psql -U devpulse -d devpulse -c "SELECT 1 FROM pg_database WHERE datname = 'devpulse_test'" | grep -q 1 || docker compose exec -T postgres psql -U devpulse -d devpulse -c "CREATE DATABASE devpulse_test;"

      - name: Generate Prisma client & apply migrations
        run: |
          pnpm db:generate
          pnpm exec prisma migrate deploy
          DATABASE_URL="postgresql://devpulse:devpulse_secret@localhost:5433/devpulse_test?schema=public" pnpm exec prisma migrate deploy

      - name: Lint codebase
        run: pnpm lint

      - name: Run test suites (Unit & Integration)
        run: pnpm test

      - name: Build packages and applications
        run: pnpm build

      - name: Verify demo seed script idempotency
        run: |
          pnpm db:seed
          pnpm db:seed
